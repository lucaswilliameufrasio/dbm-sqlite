[package]
name = "dbm-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Synchronous SQLite library for application cores"
readme = "README.md"
repository = "https://github.com/lucaswilliameufrasio/dbm-sqlite"
publish = false

[lib]
name = "dbm_sqlite"
path = "src/lib.rs"

[features]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
members = [".", "crates/dbm-sqlite-flutter"]
resolver = "3"

[profile.flutter]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
